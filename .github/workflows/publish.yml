name: Publish to NPM

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      # A prerelease must NOT take the `latest` dist-tag, or every existing user gets it
      # from a plain `npm install`. npm-publish defaults `tag` to `latest` regardless of
      # semver, so derive it from the version instead.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "publishing $VERSION to dist-tag $(grep '^tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

      - name: Publish to NPM (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          provenance: true
          tag: ${{ steps.disttag.outputs.tag }}

      - name: Publish to NPM (on release)
        if: github.event_name == 'release'
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          provenance: true
          tag: ${{ steps.disttag.outputs.tag }}
